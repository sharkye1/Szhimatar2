[package]
name = "szhimatar"
version = "1.4.2"
description = "Offline video compressor"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
    "http-all",
    "process-relaunch",
    "shell-execute",
    "protocol-asset",
    "window-unminimize",
    "window-maximize",
    "window-set-title",
    "window-start-dragging",
    "window-show",
    "window-hide",
    "window-set-focus",
    "window-unmaximize",
    "window-minimize",
    "window-close",
    "dialog-all",
    "fs-all",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"
walkdir = "2.4"
lazy_static = "1.4"
regex = "1.10"
base64 = "0.22"
# For simple updater
reqwest = { version = "0.11", features = ["blocking", "stream"] }
sha2 = "0.10"
hex = "0.4"
zip = "0.6"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "process", "macros"] }
tokio-util = "0.7"
tauri-plugin-drag = "0.1.0"
drag = "0.2.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
clipboard-win = "5.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
