name: Checks and Windows release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the release commit in main
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate version and select commit
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Enter a full commit SHA"; exit 1; }
            git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA" || { echo "The release commit must be in main"; exit 1; }
            git checkout --detach "$RELEASE_SHA"
            if [[ ! -f scripts/publish-release.mjs || ! -f src-tauri/update-public-key.hex ]]; then
              echo "Select a commit that supports signed Windows releases"
              exit 1
            fi
          fi
          node scripts/release-version.mjs detect

  checks:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: rustup show active-toolchain
      - run: npm ci
      - run: node scripts/check-release-tooling.mjs
      - run: npm test
      - name: Build frontend
        run: npm run build
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  macos-checks:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: rustup show active-toolchain
      - run: npm ci
      - run: npm test
      - name: Build frontend
        run: npm run build
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  build:
    needs: [prepare, checks, macos-checks]
    if: needs.prepare.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - run: rustup show active-toolchain
      - run: npm ci
      - name: Build Windows application
        run: npm run tauri -- build --ci -- --locked
      - name: Collect portable application and installers
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/szhimatar.exe' -Destination 'release-assets/Szhimatar.exe'
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/Szhimatar_$($env:VERSION)_x64-setup.exe" -Destination 'release-assets/'
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/msi/Szhimatar_$($env:VERSION)_x64_en-US.msi" -Destination 'release-assets/'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: publish-windows-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-assets
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          SZHIMATAR_UPDATE_PRIVATE_KEY: ${{ secrets.SZHIMATAR_UPDATE_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.commit }}
        run: node scripts/publish-release.mjs "$VERSION" "$RELEASE_SHA" release-assets
