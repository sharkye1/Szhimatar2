name: Build macOS App

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: rustup target add aarch64-apple-darwin
      - run: npm ci
      - name: Build Tauri application
        run: npm run tauri -- build --ci --target aarch64-apple-darwin -- --locked
      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          apps=("$bundle"/macos/*.app)
          disks=("$bundle"/dmg/*.dmg)
          [[ "${#apps[@]}" == 1 && "${#disks[@]}" == 1 ]]
          mkdir release-assets
          cp "${disks[0]}" release-assets/
          tar -czf release-assets/Szhimatar-macos-arm64.app.tar.gz -C "$bundle/macos" "$(basename "${apps[0]}")"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: szhimatar-mac-build
          path: release-assets/*
          if-no-files-found: error
